services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandshield
      POSTGRES_USER: brandshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - brandshield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandshield -d brandshield"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://brandshield:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/brandshield
      JWT_SECRET: ${JWT_SECRET:-local_compose_secret_change_before_deploy}
      CORS_ORIGINS: http://localhost:5173
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:20-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
      - /web/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
volumes:
  brandshield_pg:
